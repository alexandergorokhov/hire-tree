[workspace]
resolver = "2"
members = ["core", "contracts/job", "contracts/mock-usdc", "contracts/mock-outlayer", "contracts/factory"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alexandergorokhov/agent-hire"

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = { version = "0.10", default-features = false }
hex = "0.4"
proptest = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# No debug info keeps target/ small (disk is tight on the build box).
[profile.dev]
debug = false
overflow-checks = true

# near-sdk's mocked runtime and proptest run optimised in tests.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
