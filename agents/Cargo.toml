[package]
name = "hire-tree-agents"
description = "Hire Tree agents (lead, workers, check keeper), their tool surface and MCP server, plus near-sandbox integration tests."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Kept out of the main workspace so `make test` stays light and offline.
[workspace]

[dependencies]
near-sandbox = "0.4"
near-api = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
secp256k1 = { version = "0.27", features = ["recovery"] }
hire-tree-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
base64 = "0.22"
futures = "0.3"

[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 1
