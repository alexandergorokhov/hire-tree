<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" rx="14" fill="#fbfaf7"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b6a66"/></marker></defs>
<text x="28" y="40" font-size="20" font-weight="700" fill="#1f1e1c">Every job is a NEAR account. Any worker can hire below itself.</text>
<text x="28" y="64" font-size="13.5" fill="#55534e">One real tree from the swarm run (round 4, quality lead). Money only flows down a level when that account's work is bought.</text>
<rect x="28" y="92" width="200" height="74" rx="10" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.5"/>
<text x="42" y="116" font-size="14" font-weight="700" fill="#1f1e1c">Client</text>
<text x="42" y="136" font-size="12.5" fill="#3d3c38">posts 70.00 fUSD</text>
<text x="42" y="154" font-size="12" fill="#6b6a66">one ft_transfer_call</text>
<rect x="300" y="92" width="250" height="74" rx="10" fill="#eef3fb" stroke="#7a9cd1" stroke-width="1.5"/>
<text x="314" y="116" font-size="14" font-weight="700" fill="#1f1e1c">job-11.hub  (quality lead)</text>
<text x="314" y="136" font-size="12.5" fill="#3d3c38">holds 69.65 fUSD</text>
<text x="314" y="154" font-size="12" fill="#6b6a66">factory keeps 0.5% = 0.35</text>
<line x1="228" y1="129" x2="298" y2="129" stroke="#6b6a66" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="330" y="214" width="430" height="74" rx="10" fill="#eef7ef" stroke="#6fae78" stroke-width="1.5"/>
<text x="344" y="238" font-size="14" font-weight="700" fill="#1f1e1c">t1.job-11.hub  ·  translate</text>
<text x="344" y="258" font-size="12.5" fill="#3d3c38">tra-contractor won at 12.60 of 20.00 max</text>
<text x="344" y="276" font-size="12" fill="#6b6a66">9 sealed bids, slot bond 0.05 NEAR · check 8/10 · paid early</text>
<line x1="340" y1="166" x2="340" y2="214" stroke="#6b6a66" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="350" y="194.0" font-size="11.5" fill="#6b6a66">hires: open bids, award</text>
<rect x="360" y="322" width="430" height="74" rx="10" fill="#fdf3e6" stroke="#d79a4a" stroke-width="1.5"/>
<text x="374" y="346" font-size="14" font-weight="700" fill="#1f1e1c">t1.t1.job-11.hub  ·  glossary</text>
<text x="374" y="366" font-size="12.5" fill="#3d3c38">glo-lean won at 5.44 of 7.56 max</text>
<text x="374" y="384" font-size="12" fill="#6b6a66">3 bids, slot bond 0.05 NEAR · check 8/10 · paid early</text>
<line x1="360" y1="288" x2="360" y2="322" stroke="#6b6a66" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="370" y="309.0" font-size="11.5" fill="#6b6a66">tra-contractor hires out of its own pay, keeps 7.16</text>
<text x="28" y="218" font-size="13" font-weight="700" fill="#3d3c38">What each account does by itself:</text>
<text x="28" y="240" font-size="12.5" font-weight="400" fill="#3d3c38">1  takes bids (sealed: commit, then reveal)</text>
<text x="28" y="262" font-size="12.5" font-weight="400" fill="#3d3c38">2  holds the winner&#x27;s NEAR bond</text>
<text x="28" y="284" font-size="12.5" font-weight="400" fill="#3d3c38">3  checks the NEAR AI signature on the work</text>
<text x="28" y="306" font-size="12.5" font-weight="400" fill="#3d3c38">4  pays early when the check passes</text>
<text x="28" y="328" font-size="12.5" font-weight="400" fill="#3d3c38">5  junk: fired, no pay, bond to the buyer</text>
<text x="28" y="350" font-size="12.5" font-weight="400" fill="#3d3c38">6  sends the rest up and deletes itself</text>
<text x="28" y="550" font-size="11.5" fill="#8a8882">Drawn by scripts/pitch-svg.py from web/swarm.json (make swarm). Fake test USD on a local NEAR node.</text>
</svg>