[package]
name = "hire-tree-job"
description = "Hire Tree job contract: one global contract for every job and sub-job account."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `unstable` exposes env::ecrecover (receipt verification).
near-sdk = { workspace = true, features = ["unstable"] }
hire-tree-core = { path = "../../core" }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "unstable"] }
# Test-only signer for NEAR AI Cloud-style receipts (never in the wasm).
secp256k1 = { version = "0.27", features = ["recovery"] }
hex.workspace = true
