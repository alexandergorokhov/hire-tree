[package]
name = "hire-tree-sandbox"
description = "near-sandbox integration tests for Hire Tree: a real local node, real global contract, real deletes."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Kept out of the main workspace so `make test` stays light and offline.
[workspace]

[dependencies]

[dev-dependencies]
near-sandbox = "0.4"
near-api = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
secp256k1 = { version = "0.27", features = ["recovery"] }
hire-tree-core = { path = "../../core" }

[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 1
